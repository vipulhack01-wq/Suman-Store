<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Suman Store</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f1f3f6;
            font-family: Arial, sans-serif;
        }

        .wishlist-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 15px;
        }

        .wishlist-box {
            background: white;
            border-radius: 8px;
            padding: 22px;
        }

        .wishlist-heading {
            font-size: 24px;
            color: #212121;
            padding-bottom: 18px;
            border-bottom: 1px solid #eee;
        }

        .wishlist-item {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 22px 0;
            border-bottom: 1px solid #eee;
        }

        .wishlist-image {
            width: 125px;
            height: 125px;
            object-fit: contain;
            background: #f8f8f8;
            border-radius: 6px;
        }

        .wishlist-info {
            flex: 1;
        }

        .wishlist-info h3 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #212121;
        }

        .wishlist-price {
            color: #2874f0;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .wishlist-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .wishlist-actions button,
        .wishlist-actions a {
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .move-btn {
            background: #2874f0;
            color: white;
        }

        .remove-btn {
            background: #fff0f0;
            color: #d32f2f;
        }

        .view-btn {
            background: #f1f3f6;
            color: #212121;
        }

        .empty-wishlist {
            text-align: center;
            padding: 60px 15px;
        }

        .empty-wishlist h2 {
            color: #212121;
        }

        .empty-wishlist p {
            color: #777;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #2874f0;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            .wishlist-item {
                align-items: flex-start;
                gap: 12px;
            }

            .wishlist-image {
                width: 90px;
                height: 90px;
            }

            .wishlist-info h3 {
                font-size: 15px;
            }

            .wishlist-price {
                font-size: 17px;
            }

            .wishlist-actions button,
            .wishlist-actions a {
                padding: 9px 11px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="wishlist-container">
        <div class="wishlist-box">

            <h2 class="wishlist-heading">
                My Wishlist
            </h2>

            {% if wishlist_items %}

                {% for item in wishlist_items %}

                    <div class="wishlist-item">

                        <img
                            class="wishlist-image"
                            src="{{ url_for('static', filename='uploads/products/' ~ item.product.image) }}"
                            alt="{{ item.product.name }}"
                            onerror="this.src='https://placehold.co/150x150?text=Product'"
                        >

                        <div class="wishlist-info">

                            <h3>{{ item.product.name }}</h3>

                            <div class="wishlist-price">
                                ₹{{ "%.2f"|format(item.product.price) }}
                            </div>

                            <div class="wishlist-actions">

                                <form method="POST"
                                      action="{{ url_for('wishlist_move_to_cart', wishlist_id=item.id) }}">

                                    <button type="submit" class="move-btn">
                                        Move to Cart
                                    </button>
                                </form>

                                <a class="view-btn"
                                   href="{{ url_for('product_detail', product_id=item.product.id) }}">
                                    View Product
                                </a>

                                <form method="POST"
                                      action="{{ url_for('remove_from_wishlist', wishlist_id=item.id) }}">

                                    <button type="submit" class="remove-btn">
                                        Remove
                                    </button>
                                </form>

                            </div>
                        </div>
                    </div>

                {% endfor %}

            {% else %}

                <div class="empty-wishlist">
                    <h2>Your Wishlist is Empty!</h2>
                    <p>Save products here to buy them later.</p>

                    <a href="{{ url_for('home') }}" class="shop-btn">
                        Continue Shopping
                    </a>
                </div>

            {% endif %}

        </div>
    </div>

</body>
</html>
