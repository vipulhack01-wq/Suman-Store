<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Suman Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #101828, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 12px;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 21px;
            margin-bottom: 18px;
            color: #222;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
            margin-top: 14px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 18px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .google-btn {
            background: #222;
        }

        .google-btn:hover {
            background: #444;
        }

        .phone-btn {
            background: #059669;
        }

        .phone-btn:hover {
            background: #047857;
        }

        .divider {
            text-align: center;
            color: #888;
            margin: 22px 0;
        }

        .section {
            border-top: 1px solid #eee;
            margin-top: 24px;
            padding-top: 22px;
        }

        .hidden {
            display: none;
        }

        .message {
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .footer a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        #recaptcha-container {
            margin-top: 12px;
        }

        @media(max-width: 480px) {
            .container {
                padding: 23px 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">Suman Store</div>
    <p class="subtitle">Create your account and start shopping</p>

    <div id="message" class="message"></div>

    <!-- EMAIL REGISTRATION -->

    <h2>Email Registration</h2>

    <form id="emailRegisterForm">

        <label>Full Name</label>
        <input type="text" id="emailName"
               placeholder="Enter your name" required>

        <label>Email Address</label>
        <input type="email" id="emailAddress"
               placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="emailPassword"
               placeholder="Minimum 8 characters"
               minlength="8" required>

        <label>Account Type</label>
        <select id="emailRole" required>
            <option value="customer">Customer</option>
            <option value="seller">Seller</option>
        </select>

        <button type="submit" id="sendOtpBtn">
            Send Email OTP
        </button>

    </form>

    <!-- EMAIL OTP VERIFICATION -->

    <div id="emailOtpSection" class="section hidden">

        <h2>Verify Your Email</h2>

        <p style="color:#666; font-size:14px;">
            A 6-digit OTP has been sent to your email.
        </p>

        <label>Enter OTP</label>
        <input type="text" id="emailOtp"
               placeholder="Enter 6 digit OTP"
               maxlength="6" inputmode="numeric">

        <button id="verifyOtpBtn" type="button">
            Verify OTP & Register
        </button>

        <button id="resendOtpBtn" type="button"
                style="background:#64748b;">
            Resend OTP
        </button>

    </div>

    <div class="divider">OR REGISTER WITH</div>

    <!-- GOOGLE REGISTRATION -->

    <button type="button"
            class="google-btn"
            onclick="googleRegister()">
        Continue with Google
    </button>

    <!-- PHONE REGISTRATION -->

    <div class="section">

        <h2>Phone Registration</h2>

        <label>Full Name</label>
        <input type="text" id="firebaseName"
               placeholder="Enter your name">

        <label>Account Type</label>
        <select id="firebaseRole">
            <option value="customer">Customer</option>
            <option value="seller">Seller</option>
        </select>

        <label>Phone Number</label>
        <input type="tel" id="phoneNumber"
               placeholder="+919876543210">

        <div id="recaptcha-container"></div>

        <button type="button"
                class="phone-btn"
                onclick="sendPhoneOTP()">
            Send Phone OTP
        </button>

        <div id="phoneOtpSection" class="hidden">

            <label>Enter Phone OTP</label>

            <input type="text" id="phoneOtp"
                   placeholder="Enter OTP"
                   maxlength="6"
                   inputmode="numeric">

            <button type="button"
                    class="phone-btn"
                    onclick="verifyPhoneOTP()">
                Verify Phone & Register
            </button>

        </div>

    </div>

    <div class="footer">
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </div>

</div>

<!-- FIREBASE SDK -->

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>

    // FIREBASE CONFIGURATION

    const firebaseConfig = {
        apiKey: "AIzaSyBBE1ybzyremvPC49NJxxaPgNZtXvc7SzM",
        authDomain: "sumanstore-f1532.firebaseapp.com",
        projectId: "sumanstore-f1532",
        storageBucket: "sumanstore-f1532.firebasestorage.app",
        messagingSenderId: "77879461120",
        appId: "1:77879461120:web:a511144bc439520f8b9fe5",
        measurementId: "G-P9HS42KQPL"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();

    // MESSAGE FUNCTION

    function showMessage(message, type = "error") {

        const box = document.getElementById("message");

        box.innerText = message;
        box.className = "message " + type;
        box.style.display = "block";
    }

    // SAFE RESPONSE HANDLER

    async function getResponse(response) {

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error("Server returned an invalid response.");
        }

        if (!response.ok) {
            throw new Error(data.message || "Something went wrong.");
        }

        return data;
    }

    // EMAIL OTP REGISTRATION

    document.getElementById("emailRegisterForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("emailName").value.trim();
            const email = document.getElementById("emailAddress").value.trim();
            const password = document.getElementById("emailPassword").value;
            const role = document.getElementById("emailRole").value;

            const button = document.getElementById("sendOtpBtn");

            button.disabled = true;
            button.innerText = "Sending OTP...";

            try {

                const response = await fetch(
                    "{{ url_for('send_registration_otp') }}",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password,
                            role: role
                        })
                    }
                );

                const data = await getResponse(response);

                document.getElementById("emailOtpSection")
                    .classList.remove("hidden");

                document.getElementById("emailRegisterForm")
                    .classList.add("hidden");

                showMessage(data.message, "success");

            } catch(error) {

                showMessage(error.message);

            } finally {

                button.disabled = false;
                button.innerText = "Send Email OTP";

            }

        });

    // VERIFY EMAIL OTP

    document.getElementById("verifyOtpBtn")
        .addEventListener("click", async function() {

            const otp = document.getElementById("emailOtp").value.trim();

            if (!/^\d{6}$/.test(otp)) {
                showMessage("Enter a valid 6 digit OTP.");
                return;
            }

            const button = document.getElementById("verifyOtpBtn");

            button.disabled = true;
            button.innerText = "Verifying...";

            try {

                const response = await fetch(
                    "{{ url_for('verify_registration_otp') }}",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            otp: otp
                        })
                    }
                );

                const data = await getResponse(response);

                showMessage(data.message, "success");

                if (data.redirect) {
                    window.location.href = data.redirect;
                }

            } catch(error) {

                showMessage(error.message);

            } finally {

                button.disabled = false;
                button.innerText = "Verify OTP & Register";

            }

        });

    // RESEND EMAIL OTP

    document.getElementById("resendOtpBtn")
        .addEventListener("click", async function() {

            const button = document.getElementById("resendOtpBtn");

            button.disabled = true;
            button.innerText = "Sending...";

            try {

                const response = await fetch(
                    "{{ url_for('resend_registration_otp') }}",
                    {
                        method: "POST"
                    }
                );

                const data = await getResponse(response);

                showMessage(data.message, "success");

            } catch(error) {

                showMessage(error.message);

            } finally {

                button.disabled = false;
                button.innerText = "Resend OTP";

            }

        });

    // GOOGLE REGISTRATION

    async function googleRegister() {

        const name = document.getElementById("firebaseName").value.trim();
        const role = document.getElementById("firebaseRole").value;

        if (!name) {
            showMessage("Please enter your name in Phone Registration section.");
            return;
        }

        try {

            const provider = new firebase.auth.GoogleAuthProvider();

            const result = await auth.signInWithPopup(provider);

            await backendRegister(result.user, name, role);

        } catch(error) {

            showMessage(error.message);

        }

    }

    // FIREBASE PHONE OTP

    let confirmationResult = null;
    let recaptchaVerifier = null;

    async function setupRecaptcha() {

        if (!recaptchaVerifier) {

            recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
                "recaptcha-container",
                {
                    size: "normal"
                }
            );

        }

        await recaptchaVerifier.render();

    }

    async function sendPhoneOTP() {

        const phone = document.getElementById("phoneNumber").value.trim();
        const name = document.getElementById("firebaseName").value.trim();

        if (!name) {
            showMessage("Please enter your name.");
            return;
        }

        if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
            showMessage("Enter phone number with country code. Example: +919876543210");
            return;
        }

        try {

            await setupRecaptcha();

            confirmationResult = await auth.signInWithPhoneNumber(
                phone,
                recaptchaVerifier
            );

            document.getElementById("phoneOtpSection")
                .classList.remove("hidden");

            showMessage("Phone OTP sent successfully!", "success");

        } catch(error) {

            showMessage(error.message);

            if (recaptchaVerifier) {
                recaptchaVerifier.clear();
                recaptchaVerifier = null;
            }

        }

    }

    // VERIFY PHONE OTP

    async function verifyPhoneOTP() {

        const otp = document.getElementById("phoneOtp").value.trim();

        if (!confirmationResult) {
            showMessage("Please send OTP first.");
            return;
        }

        if (!/^\d{6}$/.test(otp)) {
            showMessage("Enter valid 6 digit OTP.");
            return;
        }

        try {

            const result = await confirmationResult.confirm(otp);

            const name = document.getElementById("firebaseName").value.trim();
            const role = document.getElementById("firebaseRole").value;

            await backendRegister(result.user, name, role);

        } catch(error) {

            showMessage(error.message);

        }

    }

    // SEND FIREBASE USER TO FLASK

    async function backendRegister(user, name, role) {

        try {

            const idToken = await user.getIdToken();

            const response = await fetch(
                "{{ url_for('firebase_register') }}",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        idToken: idToken,
                        name: name,
                        role: role
                    })
                }
            );

            const data = await getResponse(response);

            showMessage(data.message, "success");

            if (data.redirect) {
                window.location.href = data.redirect;
            }

        } catch(error) {

            showMessage(error.message);

        }

    }

</script>

</body>
</html>
